[package]
name = "vkd"
version = "0.12.0-pre.12"
authors = ["akd contributors"]
description = "Abstract trait and framework for verifiable key directories"
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/facebook/akd"
publish = false

[features]
bench = ["dep:criterion", "dep:tokio", "dep:rand"]

[dependencies]
akd_core = { path = "../akd_core", default-features = false, features = ["vrf"] }
async-trait = "0.1"
criterion = { version = "0.5", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
rand = { version = "0.8", optional = true }
